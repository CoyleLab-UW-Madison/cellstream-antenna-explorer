<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cellstream Antenna-Circuit Explorer — 36-Construct Bt₂cAMP MinDE Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/explorer.css" />
</head>
<body>

  <!-- Top Sticky Header (Styled after H9_FOV_Physiology_Atlas_Viewer.html) -->
  <header>
    <div class="title-block">
      <h1>Cellstream Antenna-Circuit Explorer — 36-Member (4 × 3×3) Bt₂cAMP MinDE Wave-Coupling Library</h1>
      <p>4 Families (WT / R70A × Upright / Inverse) × 9 Valencies (1×1 → 3×3) | Compare 2D Stoichiometry Phase Portraits, Pixel-Voxel &amp; Single-Cell (<code>ultrack</code>) Dose-Response Curves</p>
    </div>
    <div class="mode-tabs">
      <button class="mode-btn active" data-mode="single" id="tab-single">1. Single-Circuit Inspector</button>
      <button class="mode-btn" data-mode="family3x3" id="tab-family3x3">2. 3×3 Family Explorer</button>
      <button class="mode-btn" data-mode="library6x6" id="tab-library6x6">3. Full 4×(3×3) Library</button>
      <button class="mode-btn" data-mode="pairwise" id="tab-pairwise">4. Side-by-Side Comparator</button>
      <button class="mode-btn" data-mode="target" id="tab-target">5. Target Response Finder</button>
      <button class="mode-btn" data-mode="table" id="tab-table">6. Sortable 38-Construct Table</button>
    </div>
  </header>

  <!-- Row 1 Control Bar: Family, Valency, Data Unit (Pixel vs Cell), Contour Filter -->
  <div id="controls-bar" class="controls-bar"></div>

  <!-- Row 2 Focus Bar: Display / Focus View, Single-Metric Zoom Pills, Zoom Size Slider -->
  <div id="focus-bar" class="focus-bar"></div>

  <!-- Main Dynamic Workspace -->
  <main>
    <div id="view-container"></div>
  </main>

  <!-- Floating Consolas/JetBrains Mono Tooltip for 2D Phase Portrait Stoichiometry Bins -->
  <div id="portrait-tooltip" role="tooltip"></div>

  <!-- Precompiled Library Data Bundle (works over both file:// and GitHub Pages https://) -->
  <script src="data/antenna_library_bundle.js"></script>
  <!-- Optional AlphaFold / PDB Custom Schematic Manifest -->
  <script src="assets/schematics/manifest.js"></script>
  <!-- Core Rendering & Inverse-Design Modules -->
  <script src="js/colormaps.js"></script>
  <script src="js/antenna_schematics.js"></script>
  <script src="js/canvas_portraits.js"></script>
  <script src="js/quadrant_curves.js"></script>
  <script src="js/target_matcher.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
