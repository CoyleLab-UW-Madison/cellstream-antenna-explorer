<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cellstream Antenna-Circuit Explorer — 36-Construct Bt₂cAMP MinDE Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/explorer.css" />
</head>
<body>

  <!-- Top Line HUD Bar: Brand Title on Left | Live Construct & Bin Telemetry HUD on Right -->
  <header class="top-hud-bar">
    <div class="hud-brand">
      <span class="hud-logo-dot"></span>
      <div>
        <h1>Cellstream Antenna Explorer</h1>
        <div class="hud-subtitle">36-Member (4×3×3) Bt₂cAMP MinDE Wave-Coupling Library</div>
      </div>
    </div>
    <div id="hud-telemetry" class="hud-telemetry"></div>
  </header>

  <!-- Main Application Shell: Left Sidebar (Pulldowns + Active Architecture) | Right Main Viewing Area -->
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar">
      <div id="sidebar-controls" class="sidebar-controls"></div>
      <div id="sidebar-architecture" class="sidebar-architecture"></div>
    </aside>

    <main id="main-viewer" class="main-viewer">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Floating Consolas/JetBrains Mono Tooltip for 2D Phase Portrait Stoichiometry Bins -->
  <div id="portrait-tooltip" role="tooltip"></div>

  <!-- Precompiled Library Data Bundle (works over both file:// and GitHub Pages https://) -->
  <script src="data/antenna_library_bundle.js"></script>
  <script src="data/antenna_z_slices_abs.js"></script>
  <script src="data/antenna_z_slices_self.js"></script>
  <!-- Optional AlphaFold / PDB Custom Schematic Manifest -->
  <script src="assets/schematics/manifest.js"></script>
  <!-- Core Rendering & Inverse-Design Modules -->
  <script src="js/colormaps.js"></script>
  <script src="js/antenna_schematics.js"></script>
  <script src="js/canvas_portraits.js"></script>
  <script src="js/quadrant_curves.js"></script>
  <script src="js/z_slice_inspector.js"></script>
  <script src="js/target_matcher.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
